<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#111827"><title>Gunnery Timer</title><style>*{box-sizing:border-box}body{margin:0;background:#111827;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:650px;margin:auto;padding:14px}.clock{text-align:center;font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;margin:12px 0}button{width:100%;min-height:62px;border:0;border-radius:12px;background:#374151;color:white;font-size:24px;font-weight:800}#start{background:#2563eb;margin-bottom:12px}.stop{background:#dc2626!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.target{background:#166534}.penalty{background:#92400e}.card{background:#1f2937;border-radius:14px;padding:13px;margin-top:14px}.small{font-size:12px;color:#9ca3af}.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #374151;font-variant-numeric:tabular-nums}.hidden{display:none}table{border-collapse:collapse;width:100%;font-size:12px;min-width:600px}th,td{border:1px solid #4b5563;padding:7px;text-align:center}th{background:#111827}.wrap{overflow-x:auto}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.actions button{font-size:16px;min-height:52px}</style></head><body><main><section id="timer"><div class="clock" id="clock">0:00.00</div><button id="start">START TIME</button><div class="grid"><button class="" data-e="DU">DU</button><button class="" data-e="DB">DB</button><button class="" data-e="OP">OP</button><button class="" data-e="MT">MT</button><button class="target" data-e="T1">T1</button><button class="target" data-e="T2">T2</button><button class="target" data-e="T3">T3</button><button class="target" data-e="T4">T4</button><button class="penalty" data-e="AZ">AZ</button><button class="penalty" data-e="DQ">DQ</button><button class="penalty" data-e="-30">-30</button><button class="penalty" data-e="-5">-5</button></div><div class="card"><div class="small">EVENT LOG</div><div id="log"></div></div></section><section id="score" class="hidden"><div class="card"><h2>ENGAGEMENT SCORE SHEET</h2><div class="row"><span>Engagement Time</span><b id="eng">0:00.00</b></div><div class="row"><span>Targets Hit</span><b id="hits">0</b></div><div class="row"><span>Penalties</span><b id="pens">0</b></div></div><div class="card wrap"><table><thead><tr><th>Target</th><th>Kill Time</th><th>Modifier</th><th>Defilade</th><th>Break</th><th>Eng Time</th><th>Points</th></tr></thead><tbody id="rows"></tbody></table></div><div class="card"><div class="row"><span>Malfunctions</span><b id="mal">0</b></div><div class="row"><span>Penalty Codes / Remarks</span><b id="remarks">—</b></div><div class="row"><span>Base Score</span><b>—</b></div><div class="row"><span>Total Points</span><b>—</b></div></div><div class="actions"><button id="back">BACK</button><button id="new" class="stop">NEW ENGAGEMENT</button></div></section></main><script>
let run=false,t0=0,ev=[],raf;const $=x=>document.getElementById(x);
function f(ms){let s=Math.max(0,ms)/1000,m=Math.floor(s/60),q=Math.floor(s%60),c=Math.floor(ms%1000/10);return m+":"+String(q).padStart(2,"0")+"."+String(c).padStart(2,"0")}
function tick(){if(!run)return;$("clock").textContent=f(Date.now()-t0);raf=requestAnimationFrame(tick)}
function rec(n){if(!run)return;let ms=Date.now()-t0;ev.push({n,ms});let d=document.createElement("div");d.className="row";d.innerHTML="<span>"+n+"</span><b>"+f(ms)+"</b>";$("log").prepend(d)}
$("start").onclick=()=>{if(!run){run=true;t0=Date.now();ev=[];$("log").innerHTML="";$("start").textContent="STOP TIME";$("start").classList.add("stop");tick()}else{run=false;cancelAnimationFrame(raf);build();$("timer").classList.add("hidden");$("score").classList.remove("hidden");window.scrollTo(0,0)}};
document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>rec(b.dataset.e));
function build(){let du=ev.find(x=>x.n==="DU"),end=ev.at(-1)?.ms||0;$("eng").textContent=f(end-(du?.ms||0));$("hits").textContent=ev.filter(x=>/^T[1-4]$/.test(x.n)).length;let ps=ev.filter(x=>["AZ","DQ","-30","-5"].includes(x.n));$("pens").textContent=ps.length;$("mal").textContent=ev.filter(x=>x.n==="MT").length;$("remarks").textContent=ps.length?ps.map(x=>x.n).join(", "):"—";$("rows").innerHTML=[1,2,3,4].map(i=>{let x=ev.find(e=>e.n==="T"+i);return "<tr><td>T"+i+"</td><td>"+(x?f(x.ms):"—")+"</td><td>—</td><td>—</td><td>—</td><td>"+(x&&du?f(x.ms-du.ms):"—")+"</td><td>—</td></tr>"}).join("")}
$("back").onclick=()=>{$("score").classList.add("hidden");$("timer").classList.remove("hidden");window.scrollTo(0,0)}
$("new").onclick=()=>location.reload();
</script></body></html>
